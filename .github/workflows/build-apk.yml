name: Build & Release Theoflix APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.10.2-bin.zip
          echo "/opt/gradle/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          /opt/gradle/gradle-8.10.2/bin/gradle assembleDebug -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theoflix-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Theoflix App APK (Android)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Theoflix Android APK
            Versão mais recente compilada automaticamente via GitHub Actions e integrada ao OikoApp.
            
            ### ✨ Recursos:
            - Catálogo de cursos integrado em tempo real ao Firebase Firestore do OikoApp
            - Login unificado com a conta do OikoApp (Firebase Auth)
            - Player com histórico de visualização e progresso salvo
            - Suporte a modo offline
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
