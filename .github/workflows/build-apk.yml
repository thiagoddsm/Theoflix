name: Build & Release Theoflix APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.10.2-bin.zip
          echo "/opt/gradle/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Prepare Keystore and Extract SHA
        id: keystore
        run: |
          if [ ! -f theoflix-release.jks ]; then
            keytool -genkey -v -keystore theoflix-release.jks -alias theoflix -keyalg RSA -keysize 2048 -validity 10000 -storepass theoflix123 -keypass theoflix123 -dname "CN=Theoflix, OU=Oiko, O=OikoApp, L=SaoPaulo, ST=SP, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add theoflix-release.jks
            git commit -m "chore: adiciona theoflix-release.jks permanente"
            git push origin main
          fi
          SHA1_VAL=$(keytool -list -v -keystore theoflix-release.jks -alias theoflix -storepass theoflix123 | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_VAL=$(keytool -list -v -keystore theoflix-release.jks -alias theoflix -storepass theoflix123 | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "SHA1=$SHA1_VAL" >> $GITHUB_ENV
          echo "SHA256=$SHA256_VAL" >> $GITHUB_ENV
          echo "SHA-1: $SHA1_VAL"
          echo "SHA-256: $SHA256_VAL"

      - name: Build Debug APK
        run: |
          /opt/gradle/gradle-8.10.2/bin/gradle assembleDebug -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theoflix-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Theoflix App APK (Android)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Theoflix Android APK
            Versão oficial compilada via CI com suporte nativo a Google Sign-In e E-mail/Senha do OikoApp.
            
            ### 🔑 Chaves SHA para o Firebase Console:
            - **SHA-1**: `${{ env.SHA1 }}`
            - **SHA-256**: `${{ env.SHA256 }}`
            
            ### ✨ Recursos:
            - Login nativo do Google e Login com E-mail/Senha do OikoApp
            - Catálogo e módulos sincronizados em tempo real com o Firestore
            - Player com histórico e progresso salvo
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
